name: Testes de Algoritmos e Estruturas de Dados I

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compilacao-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Mostrar versao do compilador
        run: gcc --version
      - name: Compilar e executar testes das Listas 1 a 4
        run: make test
      - name: Verificar acessos invalidos e vazamentos de memoria
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make test CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g'
